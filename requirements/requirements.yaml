id: ROOT
name: 12306购票系统
description: 基于Web的铁路购票系统，包含用户认证、车票查询、预订、订单管理及个人中心等核心功能，首页参考图片：[image](./reference/index.png)。logo资源位于项目根目录的assets/logo.png，在合适的位置引用图片链接。
dependencies: []
scenarios: 
  - id: ROOT:SCE-0
    name: 进入首页
    prerequisites:
    steps:
      - action: 默认打开首页
        expectation: 初始化项目脚手架；页面加载完成，显示首页布局。
children:
  - id: REQ-1
    name: 用户认证模块
    description: 系统的基础设施，提供用户身份识别与管理能力。
    dependencies: []
    scenarios:
      - id: REQ-1:SCE-0
        name: 认证模块基础设施初始化
        prerequisites:
          - ROOT:SCE-0
        steps:
          - action: 初始化认证模块数据库和路由
            expectation: 在数据库创建 `users` 表（包含id, username, password, id_type, id_card, real_name, phone, type等字段）；前端首页右上角生成”登录“、”注册“入口，分别对应 /login 和 /register 路由及空页面容器。
    children:
      - id: REQ-1-1
        name: 用户注册
        description: 新用户创建账户，并初始化必要的关联数据。注册表单参考图片：[image](./reference/auth/register.png)
        dependencies: []
        scenarios:
          - id: REQ-1-1:SCE-0
            name: 进入注册页
            prerequisites:
              - ROOT:SCE-0 (位于首页)
            steps:
              - action: 点击首页右上角的“注册”
                expectation: 进入注册表单页
          - id: REQ-1-1:SCE-1
            name: 成功注册新用户
            prerequisites:
              - REQ-1-1:SCE-0 (已在注册页)
            steps:
              - action: 输入用户名、密码及确认密码
                expectation: 输入框内容可见，密码掩码显示。
              - action: 选择证件类型并输入姓名、证件号码
                expectation: 字段完成填写。
              - action: 选择优惠（待）类型（成人/儿童/学生/残疾军人）
                expectation: 下拉框选中对应类型。
              - action: 输入邮箱（可选）、选择手机区号并输入手机号码
                expectation: 邮箱与手机号格式校验通过，对应字段完成填写。
              - action: 勾选“我已阅读并同意《用户注册协议》”
                expectation: 复选框被选中。
              - action: 点击“下一步”按钮
                expectation: 调用注册接口，后端验证通过，数据库插入用户记录，显示“注册成功”提示，随后跳转至登录页。
          - id: REQ-1-1:SCE-2
            name: 用户名格式验证失败
            prerequisites:
              - REQ-1-1:SCE-0 (已在注册页)
            steps:
              - action: 输入不符合规则的用户名（如"123abc"数字开头）
                expectation: 用户名输入框显示红色边框，显示错误提示"用户名必须以字母开头"。
          - id: REQ-1-1:SCE-3
            name: 用户名格式验证通过
            prerequisites:
              - REQ-1-1:SCE-0 (已在注册页)
            steps:
              - action: 输入符合规则的用户名（如"abc123"，6-30位，字母开头）
                expectation: 用户名输入框显示正常边框，不显示错误提示。
          - id: REQ-1-1:SCE-4
            name: 密码强度提示
            prerequisites:
              - REQ-1-1:SCE-0 (已在注册页)
            steps:
              - action: 输入弱密码（如"123456"）
                expectation: 显示密码强度"弱"，密码强度条显示红色。
              - action: 输入强密码（如"Abc123!@#"）
                expectation: 显示密码强度"强"，密码强度条显示绿色。
          - id: REQ-1-1:SCE-5
            name: 确认密码验证失败
            prerequisites:
              - REQ-1-1:SCE-0 (已在注册页)
            steps:
              - action: 输入密码"Password123!"
                expectation: 密码框显示已输入内容（掩码）。
              - action: 输入不一致的确认密码"Password456!"
                expectation: 确认密码输入框显示红色边框，显示错误提示"两次输入的密码不一致"。
          - id: REQ-1-1:SCE-6
            name: 手机号格式验证
            prerequisites:
              - REQ-1-1:SCE-0 (已在注册页)
            steps:
              - action: 输入错误格式手机号（如"12345"）
                expectation: 手机号输入框显示红色边框，显示错误提示"请输入正确的手机号码"。
              - action: 输入正确格式手机号（如"13800138000"）
                expectation: 手机号输入框显示正常边框，不显示错误提示。
          - id: REQ-1-1:SCE-7
            name: 证件类型选择
            prerequisites:
              - REQ-1-1:SCE-0 (已在注册页)
            steps:
              - action: 点击证件类型下拉框
                expectation: 显示证件类型列表，包含"居民身份证"、"护照"、"港澳居民来往内地通行证"、"台湾居民来往大陆通行证"等选项。
          - id: REQ-1-1:SCE-8
            name: 服务条款未勾选提交失败
            prerequisites:
              - REQ-1-1:SCE-0 (已在注册页)
            steps:
              - action: 填写所有必填信息但不勾选服务条款
                expectation: 表单填写完成。
              - action: 点击"下一步"按钮
                expectation: 页面不跳转，显示提示"请先阅读并同意服务条款"，服务条款复选框高亮提示。
          - id: REQ-1-1:SCE-9
            name: 用户名已存在注册失败
            prerequisites:
              - REQ-1-1:SCE-0 (已在注册页)
              - REQ-1-1:SCE-1 (用户名"existing_user"已被注册)
            steps:
              - action: 输入已存在的用户名"existing_user"
                expectation: 用户名输入框显示输入内容。
              - action: 填写其他所有必填信息并勾选服务条款
                expectation: 表单填写完成。
              - action: 点击"下一步"按钮
                expectation: 页面不跳转，显示错误提示"用户名已被使用，请更换用户名"，用户名输入框标红。
          - id: REQ-1-1:SCE-10
            name: 身份信息核验失败
            prerequisites:
              - REQ-1-1:SCE-0 (已在注册页)
            steps:
              - action: 输入不匹配的姓名和证件号码
                expectation: 表单字段显示输入值。
              - action: 填写其他所有必填信息并勾选服务条款
                expectation: 表单填写完成。
              - action: 点击"下一步"按钮
                expectation: 系统调用公安部核验接口，核验失败，显示错误提示"身份信息验证失败，请检查姓名和证件号码是否正确"，返回注册页面。
          - id: REQ-1-1:SCE-11
            name: 手机号注册数量达到上限
            prerequisites:
              - REQ-1-1:SCE-0 (已在注册页)
            steps:
              - action: 输入已注册5个账号的手机号"13800138000"
                expectation: 手机号输入框显示输入内容。
              - action: 填写其他所有必填信息并勾选服务条款
                expectation: 表单填写完成。
              - action: 点击"下一步"按钮
                expectation: 显示错误提示"该手机号已注册5个账号，无法继续注册"，提供客服联系方式。
      - id: REQ-1-2
        name: 用户登录
        description: 验证用户身份并建立会话。登录表单参考图片：[image](./reference/auth/login.png)
        dependencies:
          - REQ-1-1
        scenarios:
          - id: REQ-1-2:SCE-0
            name: 进入登录页
            prerequisites:
              - ROOT:SCE-0 (位于首页)
            steps:
              - action: 点击首页右上角的“登录”
                expectation: 进入登录表单页
          - id: REQ-1-2:SCE-1
            name: 账号密码登录成功
            prerequisites:
              - REQ-1-2:SCE-0 (已在登录页)
              - REQ-1-1:SCE-1 (用户已注册)
            steps:
              - action: 确保“账号登录”标签处于激活状态
                expectation: 显示用户名和密码输入框。
              - action: 输入用户名/邮箱/手机号
                expectation: 输入框显示已输入内容。
              - action: 输入密码（可点击“显示/隐藏”切换可见性）
                expectation: 密码输入框显示掩码。
              - action: 点击“立即登录”按钮
                expectation: 调用登录接口，系统验证通过，后端返回登录成功响应，建立Session，跳转到首页。
          - id: REQ-1-2:SCE-2
            name: 使用手机号登录成功
            prerequisites:
              - REQ-1-2:SCE-0 (已在登录页)
              - REQ-1-1:SCE-1 (用户已注册，手机号"13800138000")
            steps:
              - action: 输入手机号"13800138000"
                expectation: 用户名输入框显示手机号。
              - action: 输入正确密码
                expectation: 密码输入框显示掩码。
              - action: 点击"立即登录"按钮
                expectation: 系统验证通过，建立Session，跳转到首页。
          - id: REQ-1-2:SCE-3
            name: 使用邮箱登录成功
            prerequisites:
              - REQ-1-2:SCE-0 (已在登录页)
              - REQ-1-1:SCE-1 (用户已注册，邮箱"test@example.com")
            steps:
              - action: 输入邮箱"test@example.com"
                expectation: 用户名输入框显示邮箱。
              - action: 输入正确密码
                expectation: 密码输入框显示掩码。
              - action: 点击"立即登录"按钮
                expectation: 系统验证通过，建立Session，跳转到首页。
          - id: REQ-1-2:SCE-4
            name: 用户名不存在登录失败
            prerequisites:
              - REQ-1-2:SCE-0 (已在登录页)
            steps:
              - action: 输入不存在的用户名"nonexistent_user"
                expectation: 用户名输入框显示输入内容。
              - action: 输入任意密码
                expectation: 密码输入框显示掩码。
              - action: 点击"立即登录"按钮
                expectation: 系统验证失败，显示错误提示"用户名或密码错误"，页面不跳转，清空密码输入框。
          - id: REQ-1-2:SCE-5
            name: 密码错误登录失败
            prerequisites:
              - REQ-1-2:SCE-0 (已在登录页)
              - REQ-1-1:SCE-1 (用户"test_user"已注册，正确密码"Password123!")
            steps:
              - action: 输入用户名"test_user"
                expectation: 用户名输入框显示输入内容。
              - action: 输入错误密码"WrongPassword"
                expectation: 密码输入框显示掩码。
              - action: 点击"立即登录"按钮
                expectation: 系统验证失败，显示错误提示"用户名或密码错误"，页面不跳转。
          - id: REQ-1-2:SCE-6
            name: 密码错误3次需要验证码
            prerequisites:
              - REQ-1-2:SCE-0 (已在登录页)
              - REQ-1-1:SCE-1 (用户已注册)
            steps:
              - action: 连续3次输入错误密码并点击"立即登录"
                expectation: 第3次失败后，显示图形验证码输入框，显示提示"密码错误次数过多，请输入验证码"。
          - id: REQ-1-2:SCE-7
            name: 密码错误5次账号锁定
            prerequisites:
              - REQ-1-2:SCE-0 (已在登录页)
              - REQ-1-1:SCE-1 (用户已注册)
            steps:
              - action: 连续5次输入错误密码并点击"立即登录"
                expectation: 第5次失败后，显示错误提示"密码错误次数过多，账号已锁定30分钟"，显示解锁倒计时，"立即登录"按钮变为灰色不可点击，显示"忘记密码？"链接。
          - id: REQ-1-2:SCE-8
            name: 用户名为空验证失败
            prerequisites:
              - REQ-1-2:SCE-0 (已在登录页)
            steps:
              - action: 不输入用户名，仅输入密码
                expectation: 密码输入框显示掩码。
              - action: 点击"立即登录"按钮
                expectation: 用户名输入框显示红色边框，显示提示"请输入用户名"，页面不跳转。
          - id: REQ-1-2:SCE-9
            name: 密码为空验证失败
            prerequisites:
              - REQ-1-2:SCE-0 (已在登录页)
            steps:
              - action: 输入用户名，不输入密码
                expectation: 用户名输入框显示输入内容。
              - action: 点击"立即登录"按钮
                expectation: 密码输入框显示红色边框，显示提示"请输入密码"，页面不跳转。
          - id: REQ-1-2:SCE-10
            name: 回车键登录
            prerequisites:
              - REQ-1-2:SCE-0 (已在登录页)
              - REQ-1-1:SCE-1 (用户已注册)
            steps:
              - action: 输入正确的用户名和密码
                expectation: 输入框显示对应内容。
              - action: 按下回车键
                expectation: 触发"立即登录"按钮点击事件，提交登录请求，验证通过后跳转到首页。
          - id: REQ-1-2:SCE-11
            name: 跳转到注册页面
            prerequisites:
              - REQ-1-2:SCE-0 (已在登录页)
            steps:
              - action: 点击"注册12306账号"链接
                expectation: 页面跳转到注册页面，URL变为"/register"。
          - id: REQ-1-2:SCE-12
            name: 跳转到找回密码页面
            prerequisites:
              - REQ-1-2:SCE-0 (已在登录页)
            steps:
              - action: 点击"忘记密码？"链接
                expectation: 页面跳转到找回密码页面，URL包含"find_password"。
      - id: REQ-1-3
        name: 找回密码
        description: 用户忘记密码时，通过身份验证和手机验证重置密码。
        dependencies:
          - REQ-1-1
        scenarios:
          - id: REQ-1-3:SCE-0
            name: 进入找回密码页
            prerequisites:
              - REQ-1-2:SCE-0 (已在登录页)
            steps:
              - action: 点击"忘记密码？"链接
                expectation: 跳转到找回密码页面，显示身份验证表单。
          - id: REQ-1-3:SCE-1
            name: 成功找回密码 - 完整流程
            prerequisites:
              - REQ-1-3:SCE-0 (已在找回密码页)
              - REQ-1-1:SCE-1 (用户已注册)
            steps:
              - action: 输入已注册的用户名
                expectation: 用户名输入框显示输入内容。
              - action: 选择证件类型并输入姓名、证件号码
                expectation: 表单字段显示输入值。
              - action: 输入注册时绑定的手机号
                expectation: 手机号输入框显示输入内容。
              - action: 点击"下一步"按钮
                expectation: 系统验证用户名、身份信息和手机号是否匹配，验证通过后发送短信验证码到手机号。
              - action: 输入收到的6位验证码
                expectation: 验证码输入框显示输入的数字。
              - action: 点击"验证"按钮
                expectation: 系统验证验证码正确性，通过后跳转到重置密码页面。
              - action: 输入新密码和确认密码
                expectation: 密码输入框显示掩码内容。
              - action: 点击"确定"按钮
                expectation: 系统更新数据库中的密码，显示"密码重置成功"提示，自动跳转到登录页面。
          - id: REQ-1-3:SCE-2
            name: 用户名不存在
            prerequisites:
              - REQ-1-3:SCE-0 (已在找回密码页)
            steps:
              - action: 输入不存在的用户名
                expectation: 用户名输入框显示输入内容。
              - action: 填写其他信息并点击"下一步"
                expectation: 显示错误提示"用户名不存在"，页面不跳转。
          - id: REQ-1-3:SCE-3
            name: 身份信息验证失败
            prerequisites:
              - REQ-1-3:SCE-0 (已在找回密码页)
              - REQ-1-1:SCE-1 (用户"test_user"已注册)
            steps:
              - action: 输入用户名"test_user"
                expectation: 用户名输入框显示输入内容。
              - action: 输入与注册时不匹配的姓名或证件号码
                expectation: 表单字段显示输入值。
              - action: 点击"下一步"按钮
                expectation: 显示错误提示"身份信息验证失败，请检查姓名和证件号码"，页面不跳转。
          - id: REQ-1-3:SCE-4
            name: 手机号不匹配
            prerequisites:
              - REQ-1-3:SCE-0 (已在找回密码页)
              - REQ-1-1:SCE-1 (用户"test_user"已注册，手机号"13800138000")
            steps:
              - action: 输入用户名"test_user"和正确的身份信息
                expectation: 表单字段显示输入值。
              - action: 输入与注册时不同的手机号"13900139000"
                expectation: 手机号输入框显示输入内容。
              - action: 点击"下一步"按钮
                expectation: 显示错误提示"手机号与注册信息不符"，页面不跳转。
          - id: REQ-1-3:SCE-5
            name: 验证码错误
            prerequisites:
              - REQ-1-3:SCE-0 (已在找回密码页)
              - REQ-1-1:SCE-1 (用户已注册)
            steps:
              - action: 完成身份验证，进入验证码输入页面
                expectation: 显示验证码输入框，提示"验证码已发送至138****8000"。
              - action: 输入错误的验证码
                expectation: 验证码输入框显示输入内容。
              - action: 点击"验证"按钮
                expectation: 显示错误提示"验证码错误，请重新输入"，页面不跳转。
          - id: REQ-1-3:SCE-6
            name: 验证码过期
            prerequisites:
              - REQ-1-3:SCE-0 (已在找回密码页)
              - REQ-1-1:SCE-1 (用户已注册)
            steps:
              - action: 完成身份验证，进入验证码输入页面
                expectation: 显示验证码输入框和5分钟倒计时。
              - action: 等待超过5分钟
                expectation: 倒计时归零。
              - action: 输入验证码并点击"验证"按钮
                expectation: 显示错误提示"验证码已过期，请重新发送"，显示"重新发送"按钮。
          - id: REQ-1-3:SCE-7
            name: 重新发送验证码
            prerequisites:
              - REQ-1-3:SCE-0 (已在找回密码页)
              - REQ-1-1:SCE-1 (用户已注册)
            steps:
              - action: 完成身份验证，进入验证码输入页面
                expectation: 显示验证码输入框。
              - action: 点击"重新发送"按钮
                expectation: 系统重新发送验证码到手机号，显示提示"验证码已重新发送"，倒计时重新开始，"重新发送"按钮变为灰色不可点击60秒。
          - id: REQ-1-3:SCE-8
            name: 新密码格式验证
            prerequisites:
              - REQ-1-3:SCE-0 (已在找回密码页)
              - REQ-1-1:SCE-1 (用户已注册)
            steps:
              - action: 通过身份验证和手机验证，进入重置密码页面
                expectation: 显示新密码和确认密码输入框。
              - action: 输入不符合规则的密码（如"123"，少于6位）
                expectation: 密码输入框显示掩码。
              - action: 移开焦点或点击"确定"按钮
                expectation: 显示错误提示"密码必须为6-20位字符"，密码输入框标红，不更新密码。
          - id: REQ-1-3:SCE-9
            name: 新密码与确认密码不一致
            prerequisites:
              - REQ-1-3:SCE-0 (已在找回密码页)
              - REQ-1-1:SCE-1 (用户已注册)
            steps:
              - action: 通过验证，进入重置密码页面
                expectation: 显示密码输入框。
              - action: 输入新密码"NewPassword123!"
                expectation: 密码输入框显示掩码。
              - action: 输入不一致的确认密码"NewPassword456!"
                expectation: 确认密码输入框显示掩码。
              - action: 点击"确定"按钮
                expectation: 显示错误提示"两次输入的密码不一致"，确认密码输入框标红，不更新密码。
          - id: REQ-1-3:SCE-10
            name: 验证码发送频率限制
            prerequisites:
              - REQ-1-3:SCE-0 (已在找回密码页)
              - REQ-1-1:SCE-1 (用户已注册)
            steps:
              - action: 完成身份验证，系统发送验证码
                expectation: 显示提示"验证码已发送"。
              - action: 立即点击"重新发送"按钮
                expectation: '"重新发送"按钮为灰色不可点击状态，显示倒计时"60秒后可重新发送"。'
              - action: 等待60秒后点击"重新发送"按钮
                expectation: 系统成功发送新验证码，显示提示"验证码已重新发送"。
  - id: REQ-2
