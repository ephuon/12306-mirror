                  - REQ-3-2:SCE-0 (已进入乘车人管理页)
                steps:
                  - action: 点击乘车人行对应的“修改”图标
                    expectation: 跳转至编辑乘车人页面，手机号、优惠类型可编辑，姓名、证件信息只读。
                  - action: 修改手机号或优惠类型，点击“保存”
                    expectation: 调用更新API，校验通过，返回乘车人列表页并显示更新后的信息。

  - id: REQ-4
    name: 订单管理模块
    description: 核心业务流程，预订车次，生成订单；查看、取消和支付订单。
    dependencies:
      - REQ-1
      - REQ-2
      - REQ-3
    scenarios:
      - id: REQ-4:SCE-0
        name: 订单模块基础设施初始化
        prerequisites:
          - ROOT:SCE-0
        steps:
          - action: 初始化订单数据模型
            expectation: 在数据库创建 `orders` (订单主表) 和 `order_items` (订单详情/车票表)，定义状态枚举（未支付/已支付/已取消）。
    children:
      - id: REQ-4-1
        name: 订单管理页
        description: 查看订单列表框架。参考图片：[image](./reference/order/order.png)
        dependencies: []
        scenarios:
          - id: REQ-4-1:SCE-0
            name: 进入订单管理页
            prerequisites:
              - REQ-1-2:SCE-1 (已登录)
              - REQ-3:SCE-0 (已进入个人中心页)
            steps:
              - action: 点击左侧导航栏"订单中心"-"火车票订单"
                expectation: 调用订单列表API，右侧展示选项卡，默认展示未完成订单。
          - id: REQ-4-1:SCE-1
            name: 切换订单标签
            prerequisites:
              - REQ-4-1:SCE-0 (已在订单管理页)
            steps:
              - action: 点击“未出行”标签
                expectation: 列表刷新，显示已支付但未出行的订单，状态为“待出行”。
              - action: 点击“历史订单”标签
                expectation: 列表刷新，显示已完成或已取消的历史订单。
          - id: REQ-4-1:SCE-2
            name: 订单详情展示
            prerequisites:
              - REQ-4-1:SCE-0 (已在订单管理页)
            steps:
              - action: 查看订单卡片信息
                expectation: 卡片包含订票日期、车次（G4087 北京南-上海虹桥）、乘客姓名、席位（二等座 10车16A）、票价及状态等完整信息。

      - id: REQ-4-2
        name: 预订车次
        description: 车次列表页点击预订，跳转到订单填写页，生成订单，订单填写页参考图片：[image](./reference/order/book.png)
        dependencies:
          - REQ-2-2
          - REQ-1-2
          - REQ-3-1
        scenarios:
          - id: REQ-4-2:SCE-0
            name: 预订车次
            prerequisites:
              - REQ-1-2:SCE-1 (已登录)
              - REQ-2-2:SCE-0 (已进入车次列表页)
            steps:
              - action: 点击车次后的“预订”按钮
                expectation: 跳转至订单填写页，回显车次信息。
              - action: 快捷选择乘车人或输入乘车人姓名，证件号码
                expectation: 表单字段显示输入值。
              - action: 点击“提交订单”
                expectation: 调用下单API，后端创建订单数据，返回订单ID，跳转到订单管理页（或支付页）。
          - id: REQ-4-2:SCE-1
            name: 选择乘车人
            prerequisites:
              - REQ-4-2:SCE-0 (已进入订单填写页)
            steps:
              - action: 勾选常用联系人复选框
                expectation: 选中联系人，右侧显示乘客信息；若选择多人，票价累加。
              - action: (若触发) 弹出“温馨提示”
                expectation: 需点击“确认”关闭提示。
          - id: REQ-4-2:SCE-2
            name: 可视化选座
            prerequisites:
              - REQ-4-2:SCE-1 (已选人)
            steps:
              - action: 选择席别（如二等座）
                expectation: 展开该席别座位图，靠窗位置带标识。
              - action: 点击座位图标（如A座）
                expectation: 图标变色（高亮），显示已选座位号。
          - id: REQ-4-2:SCE-3
            name: 提交订单异常（座位已占）
            prerequisites:
              - REQ-4-2:SCE-2 (已选座)
            steps:
              - action: 点击“提交订单”
                expectation: 后端返回“该座位已被预订”错误，页面提示重新选座，被占座位置灰。

      - id: REQ-4-3
        name: 取消订单
        description: 在未完成订单管理页，点击未完成订单的“取消订单”按钮，删除订单，参考图片：[image](./reference/order/cancel.png)
        dependencies:
          - REQ-2-2
          - REQ-1-2
          - REQ-3-1
        scenarios:
          - id: REQ-4-3:SCE-0
            name: 取消订单
            prerequisites:
              - REQ-1-2:SCE-1 (已登录)
              - REQ-4-2:SCE-0 (已预订车次)
              - REQ-4-1:SCE-0 (已进入订单管理页)
            steps:
              - action: 点击未完成订单的“取消订单”按钮
                expectation: 弹出确认取消弹窗
              - action: 点击“确定”按钮
                expectation: 调用取消订单API，校验通过，更新数据库订单状态，刷新列表。
          - id: REQ-4-3:SCE-1
            name: 放弃取消订单
            prerequisites:
              - REQ-4-1:SCE-0 (已在订单管理页)
            steps:
              - action: 点击“取消订单”按钮
                expectation: 弹出确认对话框。
              - action: 点击“取消”或关闭窗口
                expectation: 对话框消失，订单保留。
          - id: REQ-4-3:SCE-2
            name: 取消次数受限
            prerequisites:
              - REQ-4-1:SCE-0 (已在订单管理页)
            steps:
              - action: 当日第4次尝试取消
                expectation: 点击确定后，系统提示“取消次数已达上限”，订单取消失败。

      - id: REQ-4-4
        name: 支付订单
        description: 在未完成订单管理页，点击未完成订单的“支付订单”按钮，跳转到支付页，参考图片：[image](./reference/order/pay.png)
        dependencies:
          - REQ-2-2
          - REQ-1-2
          - REQ-3-1
        scenarios:
          - id: REQ-4-4:SCE-0
            name: 支付订单
            prerequisites:
              - REQ-1-2:SCE-1 (已登录)
              - REQ-4-2:SCE-0 (已预订车次)
              - REQ-4-1:SCE-0 (已进入订单管理页)
            steps:
              - action: 点击未完成订单的“支付订单”按钮
                expectation: 调用支付API，模拟支付成功，更新数据库订单状态。
              - action: 点击“未出行订单”
                expectation: 展示未出行订单选项卡，包含支付后的订单。
  - id: REQ-5
    name: 路由跳转测试模块
    description: 验证关键功能的路由跳转是否正常工作，确保用户点击按钮或链接后能够正确跳转到目标页面。
    dependencies:
      - REQ-1
      - REQ-2
      - REQ-4
    scenarios:
      - id: REQ-5:SCE-0
        name: 路由测试模块初始化
        prerequisites:
          - ROOT:SCE-0
        steps:
          - action: 初始化路由测试环境
            expectation: 确认前端路由配置已完成，所有需要测试的路由均已注册。
    children:
      - id: REQ-5-1
        name: 忘记密码路由跳转测试
        description: 测试从登录页点击"忘记密码"链接是否能正确跳转到找回密码页面。
        dependencies:
          - REQ-1-2
          - REQ-1-3
        scenarios:
          - id: REQ-5-1:SCE-0
            name: 登录页忘记密码链接跳转测试
            prerequisites:
              - REQ-1-2:SCE-0 (已在登录页)
            steps:
              - action: 定位页面上的"忘记密码？"链接
                expectation: 链接元素存在且可见。
              - action: 点击"忘记密码？"链接
                expectation: 页面URL变更为找回密码页面路径（如/forgot-password 或 /find_password），页面成功跳转并渲染找回密码表单。
              - action: 验证页面内容
                expectation: 找回密码页面包含用户名输入框、证件类型选择、姓名输入框、证件号码输入框、手机号输入框及"下一步"按钮。
          - id: REQ-5-1:SCE-1
            name: 忘记密码页面路由参数测试
            prerequisites:
              - REQ-5-1:SCE-0 (已跳转到找回密码页)
            steps:
              - action: 检查浏览器地址栏URL
                expectation: URL格式正确，不包含异常参数或错误路径。
              - action: 直接访问找回密码页面URL
                expectation: 页面能够直接加载，不依赖从登录页跳转。
          - id: REQ-5-1:SCE-2
            name: 忘记密码路由返回测试
            prerequisites:
              - REQ-5-1:SCE-0 (已在找回密码页)
            steps:
              - action: 点击浏览器后退按钮
                expectation: 页面返回到登录页面，登录表单正常显示。
              - action: 点击"返回登录"链接（如存在）
                expectation: 页面跳转回登录页面。
      - id: REQ-5-2
        name: 车票预订路由跳转测试
        description: 测试从车次列表页点击"预订"按钮是否能正确跳转到订单填写页面，并携带正确的车次信息。
        dependencies:
          - REQ-2-2
          - REQ-4-2
        scenarios:
          - id: REQ-5-2:SCE-0
            name: 未登录状态预订跳转测试
            prerequisites:
              - REQ-2-2:SCE-0 (已在车次列表页)
            steps:
              - action: 在未登录状态下点击某车次的"预订"按钮
                expectation: 系统检测到未登录状态，页面跳转到登录页面，并记录原始请求，登录成功后应能继续预订流程。
          - id: REQ-5-2:SCE-1
            name: 已登录状态预订跳转测试
            prerequisites:
              - REQ-1-2:SCE-1 (已登录)
              - REQ-2-2-3:SCE-0 (已在车次列表页并展示车次)
            steps:
              - action: 定位某个车次的"预订"按钮
                expectation: 按钮元素存在、可见且可点击。
              - action: 点击"预订"按钮
                expectation: 页面URL变更为订单填写页面路径（如/order/book 或 /booking），页面成功跳转并渲染订单填写表单。
              - action: 验证页面内容
                expectation: 订单填写页面包含车次信息（车次号、出发站、到达站、日期、时间）、乘车人选择区域、席别选择、座位选择及"提交订单"按钮。
          - id: REQ-5-2:SCE-2
            name: 预订路由参数传递测试
            prerequisites:
              - REQ-1-2:SCE-1 (已登录)
              - REQ-2-2-3:SCE-0 (已在车次列表页)
            steps:
              - action: 点击车次"G4087"的"预订"按钮
                expectation: 页面跳转到订单填写页。
              - action: 检查URL参数或页面回显数据
                expectation: URL包含车次标识（如trainId或trainNo参数），或页面通过state传递；订单填写页正确显示"G4087"车次信息，包括出发站"北京南"、到达站"上海虹桥"、发车时间等。
              - action: 验证不同车次参数
                expectation: 返回列表页，点击另一车次（如"D123"）的"预订"按钮，订单填写页应显示"D123"的信息，参数传递正确无混淆。
          - id: REQ-5-2:SCE-3
            name: 预订路由异常处理测试
            prerequisites:
              - REQ-1-2:SCE-1 (已登录)
            steps:
              - action: 直接访问订单填写页面URL，不携带车次参数
                expectation: 页面显示错误提示"缺少车次信息"或自动重定向到车次查询页，提示用户先选择车次。
              - action: 访问订单填写页面URL，携带无效车次ID
                expectation: 页面显示错误提示"车次不存在"或"车次信息无效"，提供返回查询页的链接。
          - id: REQ-5-2:SCE-4
            name: 预订路由返回测试
            prerequisites:
              - REQ-5-2:SCE-1 (已跳转到订单填写页)
            steps:
              - action: 点击浏览器后退按钮
                expectation: 页面返回到车次列表页，查询条件和列表状态保持不变。
              - action: 点击"返回"或"取消"按钮（如存在）
                expectation: 页面返回到车次列表页，未生成订单数据。
          - id: REQ-5-2:SCE-5
            name: 无余票车次预订跳转测试
            prerequisites:
              - REQ-1-2:SCE-1 (已登录)
              - REQ-2-2-3:SCE-0 (已在车次列表页)
            steps:
              - action: 定位显示"无票"或余票为0的车次
                expectation: 车次列表中该车次的"预订"按钮为灰色不可点击状态，或显示"无票"标识。
              - action: 尝试点击该车次的"预订"按钮（如可点击）
                expectation: 若可点击，系统应阻止跳转或跳转后立即提示"该车次无余票"，并返回列表页或允许选择候补。