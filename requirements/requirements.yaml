            dependencies: []
            scenarios:
              - id: REQ-2-1-2:SCE-0
                name: 输入目的地
                prerequisites:
                  - ROOT:SCE-0 (位于首页)
                steps:
                  - action: 点击目的地输入框
                    expectation: 弹出快捷选择框。
                  - action: 输入城市名称
