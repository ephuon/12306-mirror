                steps:
                  - action: 点击日期快捷条上的某个日期（如“明天”）
                    expectation: 自动更新查询日期为该日期，并重新触发查询，刷新车次列表。
          - id: REQ-2-2-2
            name: 车次筛选
            description: 位于车次列表中查询框下方的筛选框，用于根据条件筛选车次（车次类型、车次席别）。参考图片：[image](./reference/search/filter.png)
