              - id: REQ-2-2-1:SCE-1
                name: 查询条件验证失败
                prerequisites:
                  - REQ-2-2:SCE-0 (位于列表页)
                steps:
                  - action: 清空出发地或目的地
                    expectation: 输入框内容为空。
                  - action: 点击“查询”按钮
                    expectation: 页面不跳转，空的输入框显示红色警告，提示“请输入出发地/目的地”。
                  - action: 输入相同的出发地和目的地
                    expectation: 输入框显示相同城市。
                  - action: 点击“查询”按钮
                    expectation: 页面不跳转，显示错误提示“出发地和目的地不能相同”。
              - id: REQ-2-2-1:SCE-2
                name: 普通票与学生票切换
