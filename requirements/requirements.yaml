                steps:
                  - action: 选择发车时间段（如06:00-12:00）
                    expectation: 列表仅显示该时间段内发车的车次。
              - id: REQ-2-2-2:SCE-2
                name: 出发/到达车站筛选
                prerequisites:
                  - REQ-2-2:SCE-0 (已查询到车次列表)
                steps:
                  - action: 勾选具体的出发车站（如“北京南”）
                    expectation: 列表仅显示从北京南出发的车次。
                  - action: 勾选具体的到达车站（如“上海虹桥”）
                    expectation: 列表仅显示到达上海虹桥的车次。
              - id: REQ-2-2-2:SCE-3
                name: 多条件组合筛选
                prerequisites:
                  - REQ-2-2:SCE-0 (已查询到车次列表)
                steps:
                  - action: 同时选择“高铁”类型、“一等座”席别和“06:00-12:00”时间段
                    expectation: 点击筛选后，列表仅显示同时满足以上所有条件的车次。
              - id: REQ-2-2-2:SCE-4
                name: 清除筛选
                prerequisites:
                  - REQ-2-2:SCE-0 (已应用筛选条件)
                steps:
                  - action: 点击“全部”或“清除筛选”按钮
                    expectation: 所有筛选条件重置，列表恢复显示所有查询到的车次。
              - id: REQ-2-2-2:SCE-5
                name: 筛选后无结果
                prerequisites:
                  - REQ-2-2:SCE-0 (已查询到车次列表)
                steps:
                  - action: 设置严格的筛选条件组合
                    expectation: 界面显示“当前筛选条件下无车次”，并提供“清除筛选”按钮。
          - id: REQ-2-2-3
            name: 车次列表
            description: 位于车次列表页下方，核心功能，调用后端接口展示符合筛选条件的车次列表，参考图片：[image](./reference/search/result.png)
            dependencies: []
            scenarios:
              - id: REQ-2-2-3:SCE-0
                name: 展示符合筛选条件的车次列表
                prerequisites:
                  - REQ-2-2-1:SCE-0 (已触发查询)
                steps:
                  - action: 页面加载或点击查询
                    expectation: 调用车次查询API (GET /api/trains)，返回数据并渲染车次列表，显示出发/到达时间、历时、票价及余票。
              - id: REQ-2-2-3:SCE-1
                name: 车次排序
                prerequisites:
                  - REQ-2-2-3:SCE-0 (列表已展示)
                steps:
                  - action: 点击表头的“出发时间”
                    expectation: 车次按出发时间升序/降序排列。
                  - action: 点击表头的“到达时间”
                    expectation: 车次按到达时间升序/降序排列。
                  - action: 点击表头的“历时”
                    expectation: 车次按历时短长排序。
              - id: REQ-2-2-3:SCE-2
                name: 查询无车次
                prerequisites:
                  - REQ-2-2-1:SCE-0 (已触发查询)
                steps:
                  - action: 输入两地之间无直达车次的路线
                    expectation: 列表区域显示“未查询到符合条件的车次”，并提示用户“建议使用接续换乘”或“更换日期”。
              - id: REQ-2-2-3:SCE-3
                name: 显示特殊车次
                prerequisites:
                  - REQ-2-2-3:SCE-0 (列表已展示)
                steps:
                  - action: 勾选“显示折扣车次”
                    expectation: 列表中折扣票价高亮显示。
                  - action: 勾选“显示积分兑换车次”
                    expectation: 支持积分兑换的车次显示“兑”字标识。

