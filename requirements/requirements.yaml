          - id: REQ-2-2:SCE-1
            name: 首页点击进入车次列表
            prerequisites:
              - ROOT:SCE-0 (位于首页)
            steps:
              - action: 鼠标悬浮于导航栏的“车票”项
                expectation: 展示下拉菜单，其中包含“单程”选项
