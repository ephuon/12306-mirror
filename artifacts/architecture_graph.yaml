nodes:
  ROOT:
    type: REQUIREMENT
    name: 12306购票系统
    description: 基于Web的铁路购票系统，包含用户认证、车票查询、预订、订单管理及个人中心等核心功能，首页参考图片：[image](./reference/index.png)。logo资源位于项目根目录的assets/logo.png，在合适的位置引用图片链接。
  REQ-1:
    type: REQUIREMENT
    name: 用户认证模块
    description: 系统的基础设施，提供用户身份识别与管理能力。
  REQ-1-1:
    type: REQUIREMENT
    name: 用户注册
    description: 新用户创建账户，并初始化必要的关联数据。注册表单参考图片：[image](./reference/auth/register.png)
  REQ-1-2:
    type: REQUIREMENT
    name: 用户登录
    description: 验证用户身份并建立会话。登录表单参考图片：[image](./reference/auth/login.png)
  REQ-1-3:
    type: REQUIREMENT
    name: 找回密码
    description: 用户忘记密码时，通过身份验证和手机验证重置密码。
  REQ-2:
    type: REQUIREMENT
    name: 车票查询模块
    description: 查询检索车票。
  REQ-2-1:
    type: REQUIREMENT
    name: 首页快捷查询面板
    description: 快捷查询单程车票，快捷查询面板参考图片：[image](./reference/search/quick_search.png)
  REQ-2-1-1:
    type: REQUIREMENT
    name: 出发地快捷输入
    description: 点击出发地输入框，弹出快捷选择框，支持输入和快捷选择。出发地快捷选择参考图片：[image](./reference/search/quick_address.png)
  REQ-2-1-2:
    type: REQUIREMENT
    name: 目的地快捷输入
    description: 点击目的地输入框，弹出快捷选择框，支持输入和快捷选择。目的地快捷选择参考图片：[image](./reference/search/quick_address.png)
  REQ-2-1-3:
    type: REQUIREMENT
    name: 选择出发日期
    description: 点击出发日期输入框，弹出出发日期选择组件，参考图片：[image](./reference/search/quick_date.png)
  REQ-2-2:
    type: REQUIREMENT
    name: 车次列表页
    description: 展示车次数据，提供查询、筛选功能。参考图片：[image](./reference/search/result.png)
  REQ-2-2-1:
    type: REQUIREMENT
    name: 车票查询框
    description: 位于车票列表页上方的查询框，用于输入查询条件（如出发地、目的地、出发日期）。参考图片：[image](./reference/search/query.png)
  REQ-2-2-2:
    type: REQUIREMENT
    name: 车次筛选
    description: 位于车次列表中查询框下方的筛选框，用于根据条件筛选车次（车次类型、车次席别）。参考图片：[image](./reference/search/filter.png)
  REQ-2-2-3:
    type: REQUIREMENT
    name: 车次列表
    description: 位于车次列表页下方，核心功能，调用后端接口展示符合筛选条件的车次列表，参考图片：[image](./reference/search/result.png)
  REQ-3:
    type: REQUIREMENT
    name: 个人中心
    description: 管理购票所需的常用数据（如查看个人信息，乘车人）。参考图片：[image](./reference/center/self.png)
  REQ-3-1:
    type: REQUIREMENT
    name: 查看个人信息
    description: 查看用户基本信息，参考图片：[image](./reference/center/info.png)
  REQ-3-2:
    type: REQUIREMENT
    name: 乘车人管理
    description: 管理账户关联乘车人，参考图片：[image](./reference/center/passenger.png)
  REQ-3-2-1:
    type: REQUIREMENT
    name: 添加乘车人
    description: 添加新的乘车人，添加乘车人表单参考图片：[image](./reference/center/add_passenger.png)
  REQ-3-2-2:
    type: REQUIREMENT
    name: 删除乘车人
    description: 删除已添加的乘车人，不能删除账号本人，删除确认框参考图片：[image](./reference/center/delete_passenger.png)
  REQ-3-2-3:
    type: REQUIREMENT
    name: 编辑乘车人
    description: 编辑乘车人联系方式和优惠类型，不可编辑核心证件信息。
  REQ-4:
    type: REQUIREMENT
    name: 订单管理模块
    description: 核心业务流程，预订车次，生成订单；查看、取消和支付订单。
  REQ-4-1:
    type: REQUIREMENT
    name: 订单管理页
    description: 查看订单列表框架。参考图片：[image](./reference/order/order.png)
  REQ-4-2:
    type: REQUIREMENT
    name: 预订车次
    description: 车次列表页点击预订，跳转到订单填写页，生成订单，订单填写页参考图片：[image](./reference/order/book.png)
  REQ-4-3:
    type: REQUIREMENT
    name: 取消订单
    description: 在未完成订单管理页，点击未完成订单的“取消订单”按钮，删除订单，参考图片：[image](./reference/order/cancel.png)
  REQ-4-4:
    type: REQUIREMENT
    name: 支付订单
    description: 在未完成订单管理页，点击未完成订单的“支付订单”按钮，跳转到支付页，参考图片：[image](./reference/order/pay.png)
  HomePage:
    type: UI
    path: frontend/src/pages/HomePage.jsx
    description: 12306 Home Page with header, nav, and search panel placeholder
  ui_login_page:
    type: UI
    path: frontend/src/pages/Login.jsx
    description: User Login Page with username/password form
  ui_register_page:
    type: UI
    path: frontend/src/pages/Register.jsx
    description: 用户注册页面容器
  api_login:
    type: API
    path: backend/src/routes/api.js
    signature: POST /api/login
  func_loginUser:
    type: FUNC
    path: backend/src/database/operations.js
    signature: loginUser(credentials)
    db_tables:
      - users
      - login_attempts
  ui_forgot_password_page:
    type: UI
    path: frontend/src/pages/ForgotPassword.jsx
    description: Forgot Password Page with multi-step wizard
  api_forgot_password_verify_user:
    type: API
    path: backend/src/routes/api.js
    signature: POST /api/forgot-password/verify-user
  api_forgot_password_reset:
    type: API
    path: backend/src/routes/api.js
    signature: POST /api/forgot-password/reset
  func_verifyUserIdentity:
    type: FUNC
    path: backend/src/database/operations.js
    signature: verifyUserIdentity(criteria)
    db_tables:
      - users
  func_updatePassword:
    type: FUNC
    path: backend/src/database/operations.js
    signature: updatePassword(username, newPassword)
    db_tables:
      - users
  ui_quick_search_panel:
    type: UI
    path: frontend/src/components/QuickSearchPanel.jsx
    description: Quick Search Panel Component
  api_stations_list:
    type: API
    path: backend/src/routes/api.js
    signature: GET /api/stations
  api_stations_search:
    type: API
    path: backend/src/routes/api.js
    signature: GET /api/stations/search?q={query}
  func_get_all_stations:
    type: FUNC
    path: backend/src/database/operations.js
    signature: getAllStations()
    db_tables:
      - stations
  func_search_stations:
    type: FUNC
    path: backend/src/database/operations.js
    signature: searchStations(query)
    db_tables:
      - stations
  ui_station_selector:
    type: UI
    path: frontend/src/components/StationSelector.jsx
    description: Station selection component reused for destination input
